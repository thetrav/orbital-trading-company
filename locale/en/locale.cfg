[entity-description]
otc-buy-chest=A logistic chest that automatically fills with items based on constant combinator signals. Each item added costs credits.
otc-sell-chest=A chest that automatically sells all items placed inside it, crediting your account with 1 credit per item.
otc-station-builder=Place this to create a new orbital station. Enter the capsule to teleport to your station.

