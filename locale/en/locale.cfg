[entity-description]
otc-trading-silo=Buys and sells goods with Nauvis. Buy orders are kept topped up to a quantity you set, sell orders ship everything of that type, and the whole thing can be driven by the circuit network instead.
otc-station-builder=Place this to create a new orbital station. Enter the capsule to teleport to your station.
otc-shape-marker=Labels an anchor inside a shape you are capturing. Type the anchor's role into the panel, e.g. "origin", "connection:3" or "supply:iron-plate".

[item-name]
otc-station-builder=Station Builder
otc-shape-capture=Shape Capture Tool
otc-shape-config=Shape Config Tool

[item-description]
otc-station-builder=Place this to create a new orbital station. Enter the capsule to teleport to your station.
otc-shape-capture=Drag over a region to dump it to script-output as a shape definition. Left-drag captures tiles and entities, right-drag captures entities only.
otc-shape-config=Drag over entities to tag them with a shape role before capturing. Right-drag clears the tags.

